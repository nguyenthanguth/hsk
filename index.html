<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HánNgữ Pro - Học tiếng Trung miễn phí theo lộ trình HSK</title>
    <meta name="description" content="Học tiếng Trung miễn phí theo lộ trình HSK 1 đến HSK 9: từ vựng trong ngữ cảnh, flashcard, luyện nghe nói, viết chữ Hán và theo dõi tiến độ." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    
    <!-- Early Diagnostic Error Overlay -->
    <script>
      (function() {
        function renderEarlyError(title, detail, stack) {
          var box = document.getElementById('hanngu-diagnostic-box');
          if (!box) {
            box = document.createElement('div');
            box.id = 'hanngu-diagnostic-box';
            box.style.cssText = 'position:fixed;top:16px;left:16px;right:16px;max-width:850px;margin:0 auto;z-index:9999999;background:#180b0e;border:2px solid #ef4444;border-radius:12px;padding:20px;color:#fecaca;box-shadow:0 20px 50px rgba(0,0,0,0.85);font-family:system-ui,-apple-system,sans-serif;line-height:1.5;';
            (document.body || document.documentElement).appendChild(box);
          }
          box.innerHTML = 
            '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">' +
              '<span style="font-size:24px;">⚠️</span>' +
              '<strong style="font-size:16px;color:#f87171;">' + (title || 'Phát hiện sự cố khởi động script') + '</strong>' +
            '</div>' +
            '<div style="background:#281014;border:1px solid #7f1d1d;padding:12px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;color:#fca5a5;word-break:break-all;margin-bottom:12px;">' +
              (detail || 'Chi tiết lỗi không xác định') +
            '</div>' +
            (stack ? '<pre style="background:#0e0507;padding:10px;border-radius:6px;font-size:11px;color:#94a3b8;max-height:160px;overflow-y:auto;white-space:pre-wrap;margin-bottom:14px;">' + stack + '</pre>' : '') +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
              '<button onclick="window.location.reload(true)" style="background:#ef4444;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-weight:700;cursor:pointer;">🔄 Tải lại trang (F5)</button>' +
              '<button onclick="this.parentElement.parentElement.remove()" style="background:rgba(255,255,255,0.1);color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;">Đóng thông báo</button>' +
            '</div>';
        }

        window.addEventListener('error', function(e) {
          console.error('[Diagnostic Error]', e.error || e.message);
          renderEarlyError(
            'Lỗi thực thi JavaScript: ' + (e.message || ''),
            (e.filename ? ('Tệp: ' + e.filename + ' (Dòng ' + e.lineno + ':' + e.colno + ')') : ''),
            e.error ? e.error.stack : ''
          );
        });

        window.addEventListener('unhandledrejection', function(e) {
          console.error('[Diagnostic Unhandled Rejection]', e.reason);
          var reason = e.reason;
          var msg = reason ? (reason.message || String(reason)) : 'Lỗi Promise Rejection';
          var stack = reason && reason.stack ? reason.stack : '';
          renderEarlyError('Lỗi Bất Đồng Bộ (Unhandled Promise Rejection)', msg, stack);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Splash Loading Shell (Tự động thay thế khi main.js renderLayout xong) -->
      <div id="app-initial-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f1a; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 76px; height: 76px; background: linear-gradient(135deg, #ef4444, #991b1b); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.35);">
          🀄
        </div>
        <h1 style="font-size: 26px; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.5px;">HánNgữ Pro v2.0</h1>
        <p style="color: #94a3b8; font-size: 14.5px; margin: 0 0 24px 0; max-width: 480px; line-height: 1.6;">
          Đang chuẩn bị lộ trình học tiếng Trung của bạn...
        </p>
        <div style="width: 240px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 20px;">
          <div style="width: 60%; height: 100%; background: linear-gradient(90deg, #6366f1, #06b6d4); border-radius: 9999px; animation: hannguPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <div style="font-size: 12.5px; color: #64748b;">
          Nếu trang chưa hiển thị sau 3 giây, hãy bấm <a href="javascript:window.location.reload(true)" style="color: #38bdf8; text-decoration: underline;">Tải lại trang (Ctrl + F5)</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
